# Starting points: named styles, each a set of answers to the questions in
# grammar.yaml (decision 053). Choosing one fills the style builder, where
# every answer can then be changed. `subject` and `hint` steer the example
# picture drawn for the gallery (style/examples/<id>.jpg); they aren't part
# of the style.
#
# Adding one is adding an entry; the tests check its answers are all
# valid together.

styles:

- id: felt_science
  label: Felt science table
  description: Cute felt objects set down on a white table, labelled on handwritten tags.
  suits: science for everyone, health, how the body works
  subject: why yawns are contagious
  answers: {approach: objects, stage: tabletop, material: felt, people: stubby, presenter: none, mood: playful, motion: stop_motion, words: tags}

- id: meeple_logic
  label: Meeple logic puzzles
  description: Minimal matte 3D game pieces standing on a board, with clean labels and thought bubbles.
  suits: logic puzzles, game theory, probability, strategy
  subject: the hats logic puzzle
  hint: four meeples in a line, each wearing a red or blue hat; the last one thinks "Red?"
  answers: {approach: objects, stage: game_board, material: matte_3d, people: tokens, presenter: none, mood: clean, motion: smooth, words: clean}

