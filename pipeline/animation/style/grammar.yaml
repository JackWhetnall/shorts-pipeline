# The style grammar: how a channel's animated style is chosen (decision 053).
#
# Eight questions, asked in order. Each option says when it makes sense
# (`when`: every question named must have one of the listed answers; `not`:
# none of them) and what it means (`sets`), and the style is compiled from
# the options chosen, in question order: a later answer overrides an
# earlier one, except the text fields listed under `append`, which add up.
# `variants` apply extra `sets` when their own `when` matches, for what
# depends on a combination (felt on a pinboard is a felt board).
#
# `when` may also be a list of such conditions, any one of which will do.
# A question's `defaults` pick its answer when none is given (the first
# whose `when` matches; otherwise its first valid option). A question
# whose options are all ruled out isn't asked. Options that take
# `custom: true` also take the user's own words.
#
# Adding an idea is adding an option here, with the conditions that keep it
# sensible. Nothing else changes: the builder, the preview, the storyboard
# and the renderer all read it from here.

append: [image, guide, avoid, people, light, kit_view]

questions:

# ---------------------------------------------------------------------------
- id: approach
  short: Approach
  ask: How does this channel show what it's explaining?
  options:
  - id: objects
    label: Shows it with objects
    hint: Things are set out, moved and labelled, like a teacher explaining with props.
    phrase: explained with objects
    sets:
      engine: compositor
      grammar: demonstration
      continuity: move
      areas: single
      layouts: [hero, pair, row, grid, steps, cycle, group, travel, scale, lineup, table, statement]
      guide: >-
        Explain with objects. Concrete things stand for the ideas (a brain for the brain, a coin for
        money, a little house for a home); they arrive as they're mentioned, get arranged, moved
        and labelled, and arrows, rings and numbers make the explanation clear. Think like a
        teacher explaining with things in front of them, and make it tactile and clever. An object a
        later beat still needs stays and moves to its new place (keep the same key).
  - id: diagrams
    label: Draws it out
    hint: Icons, formulas, charts and diagrams build up a picture as the narration explains.
    phrase: drawn out as diagrams
    sets:
      engine: compositor
      grammar: diagram
      continuity: persist
      areas: canvas
      layouts: [hero, pair, row, grid, steps, cycle, group, travel, scale, lineup, table, statement, presenter]
      diagrams: [formula, bullets, matrix, chart, number_line, plot, graph]
      guide: >-
        Draw the idea out. Every beat is a small diagram: icons, labels, arrows and numbers that
        make the structure of the idea visible. Keep it witty and exact, like the best explainers
        online: every icon earns its place, labels say exactly what's meant, and a visual joke is
        welcome where it helps. Icons are single simple things, never scenes. Where the idea is
        numbers, maths or structure, draw it exactly with a diagram: a formula written out line by
        line, a chart, a number line, a curve, a graph of how things connect.
  - id: acted
    label: Acts it out
    hint: Characters play out the story, the example or the moment in history.
    phrase: acted out by characters
    sets:
      grammar: drama
  - id: scenic
    label: Takes you there
    hint: Cinematic scenes of places, events and things, with no recurring characters.
    phrase: shown as cinematic scenes
    sets:
      engine: generated
      grammar: documentary
      guide: >-
        Take the viewer there. Each shot is a place, a thing or an event, shown with scale and
        atmosphere; people appear only as part of the scene, never as recurring characters.

# ---------------------------------------------------------------------------
- id: stage
  short: Stage
  ask: Where does it happen?
  options:
  - id: tabletop
    label: On a tabletop, from above
    hint: A flat-lay. Objects are set down on a table and seen from directly overhead.
    phrase: on a tabletop seen from above
    when: {approach: [objects]}
    sets:
      view: top
      entrance: drop
      tilt: 4
      shadow: {mode: contact, dx: 0.55, dy: 0.85, distance: 9, blur: 10, opacity: 0.42}
      surface: >-
        An empty tabletop seen from directly above, filling the whole frame edge to edge: {board}.
        Soft, even daylight from the top left with a gentle falloff toward the bottom right.
        Nothing on it at all: no objects, no text. Photographic, like the set of a stop-motion
        animation.
      kit_view: >-
        Photographed from directly above, lying flat on a table, whole object visible with a margin
        all round, soft even daylight from the top left, no cast shadow, isolated on a transparent
        background.
      guide: Everything happens on one tabletop seen from directly above; it's one continuous performance, never a cut.
  - id: game_board
    label: On a board or table, from a low angle
    hint: Pieces stand up on a board and are seen from the side, like a game in progress.
    phrase: standing on a board seen from a low angle
    when: {approach: [objects]}
    sets:
      view: angle
      entrance: drop
      tilt: 0
      shadow: {mode: ground, opacity: 0.35, blur: 12}
      surface: >-
        {board}, seen from a low three-quarter angle, the surface receding towards the top of the
        frame into soft focus, the near part sharp and empty. Soft studio light from the top left.
        Nothing standing on it: no pieces, no objects, no text.
      kit_view: >-
        Standing upright on its base, seen from a three-quarter view slightly from above, whole
        piece visible with a margin, soft studio light from the top left, no cast shadow, isolated
        on a transparent background.
      guide: The pieces stand on a board seen from a low angle, like a game in progress; things further back are further up the frame.
  - id: pinboard
    label: Pinned to a board, face-on
    hint: Pieces are pressed onto a board (felt board, cork, magnets) and seen straight on.
    phrase: pinned to a board
    when: {approach: [objects]}
    sets:
      view: front
      entrance: pin
      tilt: 3
      shadow: {mode: contact, dx: 0.4, dy: 0.7, distance: 5, blur: 6, opacity: 0.35}
      surface: >-
        {board}, seen straight on and filling the whole frame, empty, softly and evenly lit from the
        top left. No objects, no text.
      kit_view: >-
        Seen straight on, flat against a board, whole piece visible with a margin, soft even light,
        no cast shadow, isolated on a transparent background.
      guide: Pieces are pressed onto one board, seen straight on.
  - id: diorama
    label: In a little model world
    hint: A handmade miniature landscape seen at an angle; pieces stand in it.
    phrase: in a little model world
    when: {approach: [objects]}
    sets:
      view: angle
      entrance: drop
      tilt: 0
      shadow: {mode: ground, opacity: 0.32, blur: 14}
      surface: >-
        {board}, a small handmade landscape base seen from a three-quarter angle: gentle ground
        with a little texture, a soft horizon at the top, open ground across the middle and front.
        Soft warm light. No buildings, figures or objects standing on it, no text.
      kit_view: >-
        Standing upright on its own small base, seen from a three-quarter view slightly from above,
        whole piece visible with a margin, soft light from the top left, no cast shadow, isolated
        on a transparent background.
      guide: The pieces stand in one small model landscape; things further back are further up the frame.

  - id: clean_canvas
    label: A clean canvas the camera travels across
    hint: One big flat picture that builds up; the camera moves from idea to idea.
    phrase: on a clean canvas the camera travels across
    when: {approach: [diagrams]}
    sets:
      view: front
      entrance: pop
      tilt: 0
      shadow: {mode: none}
      kit_view: >-
        A single icon, front view, simple bold shapes, centred with a margin all round, isolated on
        a transparent background, no shadow.
  - id: black
    label: Plain black, nothing else
    hint: Just the ideas on black, one at a time, like a maths animation or a sober documentary.
    phrase: on plain black
    when: {approach: [objects, diagrams]}
    sets:
      view: front
      entrance: fade
      continuity: fade
      areas: single
      tilt: 0
      shadow: {mode: none}
      canvas: "#000000"
      dark_surface: true
      diagrams: [formula, bullets, matrix, chart, number_line, plot, graph]
      camera: still, with only the slowest push on a key moment
      kit_view: >-
        A single subject, face-on, centred with a generous margin, drawn to stand out on a black
        background (light and bright colours, no black outlines), isolated on a transparent
        background, no shadow, no ground.
      guide: >-
        Everything sits on plain black, one idea at a time, calm and exact; what's no longer needed
        fades as the next idea is written in. Leave space: one diagram or one or two things at a time.
  - id: white
    label: Plain white, nothing else
    hint: Just the ideas in clean white space, like a well-designed textbook page.
    phrase: on plain white
    when: {approach: [objects, diagrams]}
    sets:
      view: front
      entrance: fade
      continuity: fade
      areas: single
      tilt: 0
      shadow: {mode: none}
      canvas: "#FFFFFF"
      dark_surface: false
      diagrams: [formula, bullets, matrix, chart, number_line, plot, graph]
      camera: still, with only the slowest push on a key moment
      kit_view: >-
        A single subject, face-on, centred with a generous margin, drawn to stand out on a white
        background, isolated on a transparent background, no shadow, no ground.
      guide: >-
        Everything sits in clean white space, one idea at a time, calm and exact; what's no longer
        needed fades as the next idea is written in. Leave space: one diagram or one or two things
        at a time.
  - id: whiteboard
    label: A whiteboard, drawn as you watch
    hint: Each idea is sketched in marker, then wiped for the next.
    phrase: sketched on a whiteboard
    when: {approach: [diagrams]}
    sets:
      view: front
      entrance: draw
      continuity: clear
      areas: single
      tilt: 0
      shadow: {mode: none}
      surface: >-
        A clean white whiteboard seen straight on, filling the whole frame, with the faintest
        ghosting of old marker and a soft reflection of room light. Nothing written on it.
      kit_view: >-
        A marker drawing on a white background, face-on, confident lines, whole drawing visible
        with a margin, isolated on a transparent background.
      guide: Each beat is a fresh sketch on the whiteboard; the board is wiped between beats.
      dark_surface: false
  - id: chalkboard
    label: A chalkboard
    hint: Chalk drawings and lettering on a dark board, wiped between ideas.
    phrase: chalked on a blackboard
    when: {approach: [diagrams]}
    sets:
      view: front
      entrance: draw
      continuity: clear
      areas: single
      tilt: 0
      shadow: {mode: none}
      dark_surface: true
      surface: >-
        A dark green-black school chalkboard seen straight on, filling the whole frame, with soft
        smudges of old chalk dust and a worn wooden frame just out of view. Nothing written on it.
      kit_view: >-
        A chalk drawing on a dark background, face-on, soft powdery chalk lines, whole drawing
        visible with a margin, isolated on a transparent background.
      guide: Each beat is a fresh chalk drawing; the board is wiped between beats.
  - id: notebook
    label: A notebook page
    hint: Doodles and notes on a lined or squared page, like the best student's notes.
    phrase: doodled in a notebook
    when: {approach: [diagrams]}
    sets:
      view: front
      entrance: draw
      continuity: clear
      areas: single
      tilt: 2
      shadow: {mode: none}
      surface: >-
        An open notebook page seen straight on, filling the whole frame: faint squared grid lines on
        warm white paper, a slight paper texture, soft daylight. Nothing written or drawn on it.
      kit_view: >-
        A doodle drawn on white paper, face-on, whole drawing visible with a margin, isolated on a
        transparent background.
      guide: Each beat is a fresh page of doodled notes.
  - id: blueprint
    label: Blueprint paper
    hint: White technical lines on deep blue, for how things are built.
    phrase: drawn as blueprints
    when: {approach: [diagrams]}
    sets:
      view: front
      entrance: draw
      continuity: clear
      areas: single
      tilt: 0
      shadow: {mode: none}
      dark_surface: true
      surface: >-
        A sheet of deep blue blueprint paper seen straight on, filling the whole frame, with a faint
        white technical grid and slightly worn edges. Nothing drawn on it.
      kit_view: >-
        A technical drawing in fine white lines on a blue background, face-on, whole drawing visible
        with a margin, isolated on a transparent background.
      guide: Each beat is a fresh technical drawing on the blueprint.
  - id: old_paper
    label: Old parchment
    hint: Ink drawings and notes on aged paper, like an explorer's journal or an old atlas.
    phrase: inked on old parchment
    when: {approach: [diagrams]}
    sets:
      view: front
      entrance: draw
      continuity: clear
      areas: single
      tilt: 1
      shadow: {mode: none}
      surface: >-
        A sheet of aged parchment seen straight on, filling the whole frame: warm tea-stained paper,
        soft foxing and worn edges, gentle light. Nothing written or drawn on it.
      kit_view: >-
        An ink drawing on old paper, face-on, whole drawing visible with a margin, isolated on a
        transparent background.
      guide: Each beat is a fresh page of the old journal.

  - id: puppet_stage
    label: A toy-theatre stage, side-on
    hint: Flat puppets perform in front of painted backdrops, like a toy theatre or a shadow play.
    phrase: performed on a toy-theatre stage
    when: {approach: [acted]}
    sets:
      engine: compositor
      grammar: puppet_drama
      continuity: scene
      areas: single
      view: front
      entrance: puppet
      tilt: 0
      shadow: {mode: contact, dx: 0.3, dy: 0.5, distance: 12, blur: 14, opacity: 0.4}
      layouts: [scene, statement]
      backdrop: >-
        A backdrop for a toy-theatre puppet show, made in {medium}: {scene}. Flat, layered painted
        scenery filling the whole frame, seen straight on, with the stage floor open and clear
        across the lower part of the picture where the puppets will stand. No figures or people,
        no text.
      kit_view: >-
        A flat puppet, full body, side view facing right, standing, whole figure visible with a
        margin, isolated on a transparent background, no shadow.
      guide: >-
        Stage it as a puppet play: each beat is a scene on the little stage with its backdrop,
        up to three puppets and perhaps a prop, and a short caption card when someone, somewhere or
        a year is introduced. Puppets walk on from the wings, turn to each other, speak in short
        bubbles when a line helps, and leave. Keep scenes for several beats; change the backdrop
        when the place changes.
  - id: miniature_set
    label: A handmade miniature set, filmed
    hint: Handmade figures on a small real-looking set, shot like stop-motion film.
    phrase: filmed on a handmade miniature set
    when: {approach: [acted]}
    sets:
      engine: generated
      camera: "a small real camera on a miniature set: slow slider moves, shallow focus pulls, locked-off shots"
  - id: animated_film
    label: An animated film world
    hint: A drawn, painted or 3D animated world, directed shot by shot like a short film.
    phrase: directed like an animated film
    when: {approach: [acted]}
    sets:
      engine: generated
  - id: storybook
    label: The pages of a storybook
    hint: Illustrated spreads, gently brought to life.
    phrase: told as a living storybook
    when: {approach: [acted]}
    sets:
      engine: generated
      camera: gentle pans and slow push-ins across the illustration, like turning pages
  - id: world
    label: The world, cinematically
    hint: Places and events shown with scale and atmosphere.
    phrase: in cinematic scenes
    when: {approach: [scenic]}
    sets:
      engine: generated
      camera: cinematic slow moves, sweeping establishing shots and intimate details

# ---------------------------------------------------------------------------
- id: material
  short: Material
  ask: What is it all made of?
  defaults:
  - {when: {stage: [game_board]}, option: wood}
  - {when: {stage: [clean_canvas]}, option: flat_vector}
  - {when: {stage: [animated_film]}, option: cel_2d}
  - {when: {stage: [storybook, world]}, option: gouache}
  - {when: {stage: [puppet_stage]}, option: paper}
  - {when: {stage: [miniature_set]}, option: clay}
  - {when: {stage: [old_paper]}, option: engraving}
  - {when: {stage: [black, white]}, option: minimal_math}
  options:

  # --- made by hand ----------------------------------------------------------
  - id: felt
    label: Felt
    hint: Cut wool felt with stitched seams and embroidered details. Soft, cute, tactile.
    phrase: in felt
    when: {stage: [tabletop, pinboard, diorama, puppet_stage, miniature_set]}
    sets:
      image: >-
        handmade felt craft: cut wool-felt pieces with visible fibres and soft fuzzy edges, neat
        blanket-stitch and running-stitch details, small embroidered accents, simple rounded shapes
      light: soft, even daylight, like a bright studio table
      palette: ["#F4A6B8", "#FFD166", "#8FD3C7", "#7FA7E8", "#F6F1E7", "#3D3A4B"]
      avoid: photorealism, glossy plastic, hard vector shapes
      cadence: twos
      texture: paper
      grade: {contrast: 1.02, saturation: 1.02, warmth: 0.12, grain: 0.18, vignette: 0.12}
      medium: felt
      boards: {tabletop: a clean warm-white linen surface with a very subtle weave, pinboard: a soft felt board in a pale colour, diorama: a little felt landscape, default: soft felt}
      motion: stop-motion felt animation, pieces nudged and set down by hand, slightly stepped timing
  - id: clay
    label: Clay (plasticine)
    hint: Handmade plasticine with fingerprints and tool marks, lit like a stop-motion set.
    phrase: in clay
    when: {stage: [tabletop, game_board, diorama, miniature_set, world]}
    sets:
      image: >-
        stop-motion claymation: handmade plasticine with visible fingerprints and tool marks, soft
        rounded forms, a slightly matte surface
      light: soft studio lighting with a warm bounce and gentle shadows
      palette: ["#E07A5F", "#3D405B", "#81B29A", "#F2CC8F", "#F4F1DE", "#6D597A"]
      avoid: smooth CGI, glossy plastic, photoreal humans
      cadence: twos
      texture: film
      grade: {contrast: 1.0, saturation: 1.0, warmth: 0.2, grain: 0.2, vignette: 0.25}
      medium: plasticine clay
      boards: {tabletop: a pale, smooth wooden board with a soft grain, game_board: a smooth clay-coloured board, diorama: a little sculpted clay landscape, default: modelled clay}
      motion: stop-motion clay animation, slightly stepped handmade movement, clay subtly shifting between frames
  - id: paper
    label: Cut paper
    hint: Coloured card and paper, cut, layered and lit from the side.
    phrase: in cut paper
    when: {stage: [tabletop, pinboard, diorama, puppet_stage, miniature_set, storybook, clean_canvas, animated_film, world, white]}
    sets:
      image: >-
        cut-paper craft: shapes cut from coloured card and textured paper with crisp or torn edges,
        visible paper grain and fibres, layers with a small soft shadow between them
      light: a warm side light raking across the paper, soft shadows between layers
      palette: ["#D1495B", "#EDAE49", "#00798C", "#30638E", "#F3E9DC", "#003D5B"]
      avoid: photorealism, glossy surfaces, drawn outlines
      cadence: twos
      texture: paper
      grade: {contrast: 1.02, saturation: 0.98, warmth: 0.15, grain: 0.3, vignette: 0.22}
      medium: cut paper and card
      boards: {tabletop: a sheet of thick, textured off-white card, pinboard: a cork board, diorama: a little landscape of layered cut paper, default: layered paper}
      motion: cut-out animation, paper pieces sliding and hinging, slightly stepped handmade timing
  - id: wood
    label: Wooden toys and game pieces
    hint: Smooth turned and painted wood, like classic toys, meeples and peg dolls.
    phrase: as wooden toys
    when: {stage: [tabletop, game_board, diorama, miniature_set, puppet_stage]}
    sets:
      image: >-
        painted wooden toys: smooth turned and cut wood with a soft satin finish, visible grain on
        unpainted edges, simple chunky shapes and a few painted details
      light: soft, warm studio light with gentle shadows
      palette: ["#C8553D", "#F2A541", "#2A9D8F", "#264653", "#F4EDE0", "#8AB17D"]
      avoid: photorealistic people, glossy plastic, fine detail
      cadence: twos
      texture: film
      grade: {contrast: 1.02, saturation: 1.0, warmth: 0.18, grain: 0.12, vignette: 0.2}
      medium: painted wood
      boards: {tabletop: a pale birch-wood tabletop, game_board: a plain wooden game board with a faint painted grid, diorama: a little wooden landscape board, default: pale wood}
      motion: wooden pieces hopped and slid by hand, with a satisfying clack as they land
  - id: matte_3d
    label: Minimal matte 3D
    hint: Clean, smooth 3D shapes in soft matte colours; simple and precise.
    phrase: in minimal matte 3D
    when: {stage: [tabletop, game_board, diorama, clean_canvas, animated_film, world, black, white]}
    sets:
      image: >-
        minimalist 3D render: everything reduced to simple geometric primitives (spheres,
        capsules, cylinders, blocks, cones) with smooth matte surfaces and softly rounded edges;
        figures simplified to smooth rounded forms with little or no facial detail, like game
        pieces or designer toys; flat matte colours from a small restrained palette, soft
        contact shadows, generous empty space, no texture, no clutter
      light: soft global illumination with a gentle key light and soft ambient occlusion
      palette: ["#E76F51", "#2A9D8F", "#E9C46A", "#264653", "#F1EFEA", "#8AB6D6"]
      avoid: photorealism, texture, clutter, fine detail, detailed faces, realistic hair, animated-film characters
      cadence: ones
      texture: none
      grade: {contrast: 1.0, saturation: 1.0, warmth: 0.05, grain: 0.03, vignette: 0.1}
      medium: minimal matte 3D
      boards: {tabletop: a smooth matte surface in a soft neutral colour, game_board: a smooth matte plane in a soft neutral colour, diorama: a smooth matte miniature landscape of simple rounded shapes, default: a smooth matte surface}
      motion: smooth, precise 3D motion with gentle easing
  - id: toy_bricks
    label: Plastic building bricks
    hint: Everything built from little plastic construction bricks.
    phrase: built from toy bricks
    when: {stage: [game_board, diorama, miniature_set]}
    sets:
      image: >-
        built from plastic construction toy bricks: studded bricks and plates in bright primary
        colours, slightly glossy plastic, chunky simplified forms (no brand markings)
      light: bright, clean studio light with crisp shadows
      palette: ["#D62828", "#F77F00", "#FCBF49", "#003049", "#EAE2B7", "#2A9D8F"]
      avoid: brand logos, photoreal humans, text
      cadence: twos
      texture: film
      grade: {contrast: 1.04, saturation: 1.05, warmth: 0.05, grain: 0.1, vignette: 0.15}
      medium: plastic toy bricks
      boards: {game_board: a large green studded baseplate, diorama: a landscape built on studded baseplates, default: studded baseplates}
      motion: brick-built stop-motion, pieces snapping into place, stepped timing
  - id: knitted
    label: Knitted wool
    hint: "Knitted and crocheted yarn: chunky stitches, cosy and homely."
    phrase: in knitted wool
    when: {stage: [tabletop, pinboard, miniature_set]}
    sets:
      image: >-
        knitted and crocheted wool: chunky visible stitches, soft yarn fuzz, stuffed rounded shapes,
        little embroidered faces where it suits
      light: soft, cosy window light
      palette: ["#E4A2A2", "#F2D0A4", "#A3C4BC", "#6D8A96", "#F7F1E8", "#4A4E69"]
      avoid: hard edges, glossy surfaces, photorealism
      cadence: twos
      texture: paper
      grade: {contrast: 1.0, saturation: 0.98, warmth: 0.2, grain: 0.15, vignette: 0.18}
      medium: knitted wool
      boards: {tabletop: a knitted blanket in a soft pale colour, pinboard: a knitted wall hanging, default: knitted wool}
      motion: stop-motion knitted figures, soft squashy movement, stepped timing
  - id: origami
    label: Folded paper (origami)
    hint: Crisp folded paper forms with clean creases.
    phrase: in folded paper
    when: {stage: [tabletop, diorama, miniature_set]}
    sets:
      image: >-
        origami: crisp folded paper forms with clean creases and flat facets, plain and patterned
        papers, soft shadows in the folds
      light: soft daylight from the side that picks out every fold
      palette: ["#E63946", "#F1FAEE", "#A8DADC", "#457B9D", "#1D3557", "#F4A261"]
      avoid: drawn outlines, photoreal humans, text
      cadence: twos
      texture: paper
      grade: {contrast: 1.03, saturation: 0.98, warmth: 0.05, grain: 0.15, vignette: 0.15}
      medium: folded paper
      boards: {tabletop: a sheet of plain white paper on a pale table, diorama: a landscape of folded paper, default: folded paper}
      motion: folded-paper stop-motion, pieces unfolding and hopping, stepped timing
  - id: cardboard
    label: Cardboard and craft materials
    hint: Corrugated card, tape, bottle caps and craft sticks, like a brilliant school project.
    phrase: in cardboard and craft materials
    when: {stage: [tabletop, diorama, miniature_set]}
    sets:
      image: >-
        cardboard craft: corrugated cardboard with visible flutes on cut edges, brown paper tape,
        bottle caps, craft sticks and marker details, handmade and inventive
      light: warm workshop light from the side
      palette: ["#C69C72", "#8C5E3C", "#E9D7B9", "#3E6990", "#E4572E", "#F6F0E4"]
      avoid: glossy plastic, photorealism, polished finishes
      cadence: threes
      texture: paper
      grade: {contrast: 1.03, saturation: 0.95, warmth: 0.18, grain: 0.22, vignette: 0.2}
      medium: cardboard
      boards: {tabletop: a scuffed wooden workbench, diorama: a landscape made of cardboard, default: cardboard}
      motion: cardboard stop-motion, chunky stepped movement

  # --- drawn and printed -----------------------------------------------------
  - id: flat_vector
    label: Flat vector
    hint: Clean flat shapes and a small palette. Sharp, modern, readable.
    phrase: in flat vector
    when: {stage: [clean_canvas, animated_film, black, white]}
    sets:
      image: >-
        clean flat vector illustration: simple geometric shapes, a small limited palette of flat
        colours, no gradients or texture, crisp edges, generous negative space
      light: flat and even, no cast shadows
      palette: ["#2B2D42", "#EF233C", "#3A86FF", "#FFBE0B", "#F2EFE8", "#8D99AE"]
      avoid: photorealism, texture, gradients, 3D shading
      cadence: ones
      texture: none
      canvas: "#F2EFE8"
