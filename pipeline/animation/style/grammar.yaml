      light: warm, soft and golden
      tone: Keep it warm and gentle, like a favourite teacher.
      energy: 40
      grade: {warmth: 0.25}
      palettes:
      - ["#E07A5F", "#F2CC8F", "#81B29A", "#3D405B", "#F4F1DE", "#B5838D"]
