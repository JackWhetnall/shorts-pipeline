      tone: Keep it calm and spacious; let each picture breathe.
      energy: 25
      grade: {saturation: 0.95}
      palettes:
      - ["#6C9BD2", "#A7C4BC", "#E9D8A6", "#F4F1EA", "#3A5A78", "#C9ADA7"]
  - id: dramatic
    label: Dramatic and moody
    hint: Deep shadows, big contrasts, tension.
    phrase: dramatic and moody
    sets:
      light: dramatic, low and directional, with deep shadows
      tone: Build tension; use scale, contrast and silence.
      energy: 55
      grade: {contrast: 1.08, vignette: 0.35}
      palettes:
      - ["#0B0B0C", "#F2F2F2", "#C1121F", "#3A3A3C", "#8D99AE", "#FDF0D5"]
      - ["#1B263B", "#415A77", "#E0E1DD", "#F2A65A", "#0D1B2A", "#C1121F"]
  - id: eerie
    label: Eerie and mysterious
    hint: Candlelight, mist and secrets.
    phrase: eerie and mysterious
    sets:
      light: dim, with candlelight, moonlight and mist
      tone: Keep it mysterious and a little eerie, never gory.
      energy: 35
      grade: {contrast: 1.05, saturation: 0.9, vignette: 0.35}
      palettes:
      - ["#1B1B2F", "#4B3F72", "#C084FC", "#E9D8A6", "#F3E9FF", "#2C6E49"]
  - id: vintage
    label: Old-fashioned and vintage
    hint: Faded colour, printed textures, a sense of the past.
    phrase: old-fashioned
    sets:
      light: soft and slightly faded
      tone: Give it the feel of something old and treasured.
      energy: 40
      grade: {saturation: 0.88, warmth: 0.3}
      palettes:
      - ["#8C2F39", "#B4652E", "#EADFC5", "#3A5A78", "#2B2118", "#6B5B48"]
  - id: bold
    label: Bold and loud
    hint: Saturated colour, strong contrast, big energy.
    phrase: bold and loud
    sets:
      light: bright and punchy
      tone: "Make it bold: big shapes, strong colour, confident moves."
      energy: 80
      grade: {contrast: 1.06, saturation: 1.1}
      palettes:
      - ["#FF006E", "#FB5607", "#FFBE0B", "#3A86FF", "#8338EC", "#FFFFFF"]

# ---------------------------------------------------------------------------
- id: motion
  short: Motion
  ask: How does it move?
  defaults:
  - {when: {stage: [whiteboard, chalkboard, notebook, blueprint, old_paper]}, option: drawn}
  - {when: {stage: [clean_canvas]}, option: snappy}
  - {when: {stage: [black, white]}, option: precise}
  - {when: {stage: [puppet_stage]}, option: puppetry}
  - {when: {stage: [miniature_set]}, option: filmed_stop_motion}
  - {when: {stage: [world]}, option: cinematic}
  - {when: {material: [soft_3d, matte_3d], stage: [animated_film]}, option: animated_3d}
  options:
  - id: stop_motion
    label: Stop-motion, on twos
    hint: Handmade and a little stepped, like pieces moved by hand between photographs.
    phrase: in stop-motion
    when: {material: [felt, clay, paper, wood, toy_bricks, knitted, origami, cardboard, custom]}
    sets:
      cadence: twos
      jitter: 1.3
  - id: stop_motion_rough
    label: Stop-motion, chunkier
    hint: "On threes: more handmade, more charm, a little rougher."
    phrase: in chunky stop-motion
    when: {material: [felt, clay, paper, wood, toy_bricks, knitted, origami, cardboard, custom]}
    sets:
      cadence: threes
      jitter: 1.8
  - id: puppetry
    label: Puppetry
    hint: Puppets glide, bob and turn on their rods.
    phrase: moved like puppets
    when: {stage: [puppet_stage]}
    sets:
      cadence: twos
      jitter: 0.8
  - id: smooth
    label: Smooth and bouncy
    hint: Fluid motion with a little overshoot and squash.
    phrase: moving smoothly
    when: {material: [matte_3d, flat_vector, isometric, soft_3d, felt, clay, wood, pixel_art, risograph, custom]}
    not: {stage: [whiteboard, chalkboard, notebook, blueprint, old_paper]}
    sets:
      cadence: ones
      jitter: 0
  - id: precise
    label: Written and drawn precisely
    hint: Formulas are written in, lines drawn, things fade between ideas. Calm and exact, like a maths lecture.
    phrase: written and drawn precisely
    when: {stage: [black, white, clean_canvas, whiteboard, chalkboard, notebook, blueprint]}
    sets:
      cadence: ones
      jitter: 0
      motion: precise, calm, eased movement; things are written and drawn in and fade out
  - id: snappy
    label: Snappy motion graphics
    hint: Crisp pops, slides and quick eases.
    phrase: with snappy motion graphics
    when: {stage: [clean_canvas, black, white]}
    sets:
      cadence: ones
      jitter: 0
      entrance: pop
  - id: drawn
    label: Drawn as you watch
    hint: Each thing appears as if being drawn.
    phrase: drawn as you watch
    when: {stage: [whiteboard, chalkboard, notebook, blueprint, old_paper, clean_canvas, black, white]}
    sets:
      entrance: draw
      cadence: ones
      jitter: 0
  - id: hand_drawn
    label: Hand-drawn animation
    hint: Drawn frame by frame, held on twos like classic animation.
    phrase: hand-animated
    when: {stage: [animated_film, storybook, world], material: [cel_2d, anime_painted, gouache, watercolour, ink_wash, pencil, noir_ink, risograph, engraving, flat_vector, paper, custom]}
    sets:
      cadence: twos
      motion: hand-drawn 2D animation held on twos, lines and texture stable, gentle secondary motion
  - id: animated_3d
    label: Smooth 3D animation
    hint: Fluid, polished movement like an animated feature.
    phrase: in smooth 3D animation
    when: {stage: [animated_film, world], material: [soft_3d, matte_3d, custom]}
    sets:
      cadence: ones
      motion: polished 3D animation with appealing arcs, squash and stretch, springy secondary motion
  - id: filmed_stop_motion
    label: Stop-motion, filmed
    hint: Real handmade stop-motion on a miniature set.
    phrase: in filmed stop-motion
    when: {stage: [miniature_set, world], material: [felt, clay, paper, wood, toy_bricks, knitted, origami, cardboard, custom]}
    sets:
      cadence: twos
      motion: stop-motion animation on a miniature set, slightly stepped handmade movement
  - id: cinematic
    label: Cinematic and flowing
    hint: Slow camera moves, atmosphere, weather and light in motion.
    phrase: with a flowing cinematic camera
    when: {stage: [animated_film, storybook, world, miniature_set]}
    sets:
      cadence: ones
      motion: cinematic motion, slow flowing camera moves, drifting atmosphere, light and weather in motion

# ---------------------------------------------------------------------------
- id: words
  short: Words on screen
  ask: How do labels and names appear on screen?
  defaults:
  - {when: {material: [minimal_math]}, option: typeset}
  - {when: {stage: [clean_canvas, black, white]}, option: clean}
  - {when: {stage: [blueprint]}, option: stencil}
  - {when: {stage: [old_paper]}, option: ink_serif}
  - {when: {stage: [game_board], material: [matte_3d, toy_bricks]}, option: clean}
  - {when: {approach: [scenic]}, option: none}
  options:
  - id: tags
    label: Handwritten paper tags
    hint: Little paper labels with handwriting, set down beside things.
    phrase: labelled on handwritten tags
    when: {stage: [tabletop, game_board, pinboard, diorama]}
    sets:
      labels: {font: Ink Free, weight: 700, size: 64, title_size: 72, tag: "#FFFDF5", write: true, rough: true, line: 7}
  - id: tape
    label: Label-maker tape
    hint: Embossed tape strips, white letters on colour.
    phrase: labelled with label-maker tape
    when: {stage: [tabletop, game_board, pinboard, diorama]}
    sets:
      labels: {font: Consolas, weight: 700, size: 52, title_size: 62, tag: "#1D1D1F", tag_text: "#FFFFFF", upper: true, tracking: 3, write: false, rough: false, line: 7}
  - id: marker
    label: Marker handwriting
    hint: Written straight on in marker, with hand-drawn arrows.
    phrase: annotated in marker
    when: {stage: [whiteboard, notebook, tabletop, pinboard, clean_canvas, white]}
    sets:
      labels: {font: Ink Free, weight: 700, size: 66, title_size: 80, tag: null, write: true, rough: true, line: 7}
  - id: chalk_text
    label: Chalk lettering
    hint: Handwritten in chalk.
    phrase: lettered in chalk
    when: {stage: [chalkboard]}
    sets:
      labels: {font: Segoe Print, weight: 700, size: 60, title_size: 76, tag: null, write: true, rough: true, line: 6, chalk: true}
  - id: clean
    label: Clean bold labels
    hint: Crisp, bold, modern type.
    phrase: with clean bold labels
    when: {stage: [clean_canvas, game_board, tabletop, diorama, blueprint, black, white]}
    sets:
      labels: {font: Segoe UI Black, weight: 900, size: 58, title_size: 72, tag: null, write: false, rough: false, line: 8}
  - id: typeset
    label: Typeset, like a maths paper
    hint: Words and maths set in the classic LaTeX face, written in as they're said.
    phrase: typeset like a maths paper
    when: {stage: [black, white, clean_canvas, notebook, blueprint, whiteboard, old_paper]}
    sets:
      labels: {font: Computer Modern, weight: 400, size: 62, title_size: 70, tag: null, write: true, rough: false, line: 4}
  - id: typewriter
    label: Typewritten slips
    hint: Typed labels on little slips of paper.
    phrase: labelled on typewritten slips
    when: {stage: [tabletop, pinboard, old_paper, clean_canvas]}
    sets:
      labels: {font: Courier New, weight: 700, size: 52, title_size: 64, tag: "#F6F0E1", write: false, rough: false, line: 6}
  - id: stencil
    label: Stencilled
    hint: Bold stencil lettering, industrial and technical.
    phrase: stencilled
    when: {stage: [blueprint, tabletop, clean_canvas]}
    sets:
      labels: {font: Stencil, weight: 400, size: 60, title_size: 76, tag: null, write: false, rough: false, line: 6, upper: true}
  - id: ink_serif
    label: Old-fashioned ink lettering
    hint: Elegant serif lettering, like a map or an old book.
    phrase: lettered like an old book
    when: {stage: [old_paper, clean_canvas]}
    sets:
      labels: {font: Book Antiqua, weight: 700, size: 58, title_size: 74, tag: null, write: true, rough: false, line: 5}
  - id: name_cards
    label: Name cards
    hint: A small printed card names a person, place or year as they're introduced.
    phrase: with name cards
    when: {approach: [acted, scenic]}
    sets:
      captions: true
      labels: {font: Constantia, weight: 700, size: 50, title_size: 70, tag: "#F3E9D2", write: false, rough: false, line: 6}
      guide: Give a beat or shot a short name card when a person, a place or a year is introduced; only what the narration says.
  - id: none
    label: No labels, only the captions
    hint: The pictures speak for themselves.
    phrase: without labels
    sets:
      labels: {font: Segoe UI Black, weight: 900, size: 58, title_size: 72, tag: null, write: false, rough: false, line: 8}
      no_labels: true
      guide: Use no labels or titles; the pictures alone carry it.
