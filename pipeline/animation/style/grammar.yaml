# ---------------------------------------------------------------------------
- id: people
  short: People
  ask: How are people shown?
  defaults:
  - {when: {approach: [scenic]}, option: none}
  - {when: {material: [wood, matte_3d]}, option: tokens}
  - {when: {material: [marker, chalk, line_art, blueprint_line]}, option: stick}
  - {when: {material: [anime_painted, noir_ink, engraving, watercolour, photo]}, option: realistic}
  - {when: {material: [minimal_math, line_icons]}, option: pictogram}
  options:
  - id: stubby
    label: Cute, stubby and round
    hint: Big round heads, little bodies, simple friendly faces.
    phrase: with cute stubby round people
    when: {material: [felt, clay, paper, wood, matte_3d, toy_bricks, knitted, cardboard, origami, flat_vector, isometric, risograph, pixel_art, marker, chalk, pencil, line_art, cel_2d, gouache, soft_3d, custom]}
    sets:
      people: >-
        people are cute, stubby and round: a big round head, a small rounded body, short limbs,
        simple dot eyes and a small friendly mouth
      guide: People are cute, stubby little figures; show who someone is by one clear detail (a hat, a tool, a colour).
  - id: tokens
    label: Game pieces (meeples, pawns, peg dolls)
    hint: People are simple tokens; who they are shows in what they wear or hold.
    phrase: with game-piece people
    when: {material: [wood, matte_3d, clay, felt, toy_bricks, flat_vector, isometric, minimal_math, custom]}
    sets:
      people: >-
        people are simple game tokens: meeples (a round head and a star-shaped body) or peg dolls,
        with no faces; who they are shows only in their colour and what they wear or hold
      guide: >-
        People are faceless game pieces, one colour each. Show a person's role or state with what
        they wear or hold (a coloured hat, a card, a coin) and with where they stand; make each
        variant its own object in the kit (a meeple wearing a red hat is a different object from
        one wearing a blue hat).
  - id: cartoon
    label: Cartoon proportions
    hint: Expressive, simplified people with big gestures.
    phrase: with cartoon people
    not: {material: [blueprint_line]}
    sets:
      people: "people have cartoon proportions: simplified, expressive faces and big readable gestures"
  - id: realistic
    label: True to life
    hint: Real proportions and faces, drawn in the medium.
    phrase: with true-to-life people
    when: {material: [gouache, watercolour, ink_wash, pencil, engraving, anime_painted, noir_ink, cel_2d, paper, clay, photo, custom]}
    sets:
      people: >-
        people have natural, true-to-life proportions and faces, rendered in the medium; ordinary,
        anonymous people, never a real identifiable person
  - id: stick
    label: Stick figures
    hint: Simple, expressive stick people.
    phrase: with stick figures
    when: {material: [marker, chalk, pencil, line_art, blueprint_line, flat_vector, neon, minimal_math, line_icons, custom]}
    sets:
      people: people are simple expressive stick figures with round heads, drawn in a few lines
      guide: People are stick figures; their poses do the acting.
  - id: blobs
    label: Little blob creatures
    hint: Round, faceful blobs instead of people. Very cute, very simple.
    phrase: with little blob creatures
    when: {material: [clay, felt, matte_3d, soft_3d, flat_vector, knitted, marker, minimal_math, line_icons, custom]}
    sets:
      people: people are little round blob creatures with two dot eyes and tiny arms, no clothes
      guide: Instead of people there are little blob creatures; give them simple expressions.
  - id: silhouettes
    label: Silhouettes
    hint: Solid dark shapes, like shadow puppets.
    phrase: with silhouette people
    when: {material: [paper, noir_ink, flat_vector, engraving, ink_wash, neon, photo, minimal_math, custom]}
    sets:
      people: people are solid dark silhouettes with crisp, expressive outlines, like shadow puppets
      guide: People are silhouettes; profile and pose tell who they are.
  - id: pictogram
    label: Pictograms, like the people on signs
    hint: A round head and a simple body in one flat colour; no face, no detail.
    phrase: with pictogram people
    when: {material: [minimal_math, line_icons, flat_vector, isometric, blueprint_line, neon, photo, matte_3d, custom]}
    sets:
      people: >-
        people are simple pictograms like the figures on public signs: a round head and a rounded
        body in one flat colour, no face, no clothes or detail
      guide: People are pictograms; who someone is shows in their colour, their pose and what they hold.
  - id: none
    label: No people
    hint: Objects, places and symbols only.
    phrase: with no people
    not: {approach: [acted]}
    sets:
      people: no people appear; use objects and symbols instead
      guide: Show no people at all; objects and symbols stand in for them.
  - id: custom
    label: Something else
    hint: Describe how people should look.
    phrase: with {custom}
    custom: true
    sets:
      people: "people look like this: {custom}"

# ---------------------------------------------------------------------------
- id: presenter
  short: Host
  ask: Is there a host on screen who talks to the viewer?
  options:
  - id: none
    label: No, just the narration
    hint: The pictures carry it; the voice stays off screen.
    phrase: ""
    when: {approach: [objects, diagrams]}
  - id: host
    label: Yes, a host character
    hint: A simple character of the channel's own opens, points, shrugs and closes.
    phrase: with a host character
    when: [{approach: [diagrams]}, {stage: [game_board, diorama, black, white]}]
    sets:
      avatar: true
      narrator: >-
        the channel's host: a single simple character in the same style as everything else,
        friendly and expressive, with one distinctive accessory

