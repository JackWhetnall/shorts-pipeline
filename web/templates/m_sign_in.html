<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0e14">
  <title>Sign in</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d0e14; color: #eceef4;
           font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 1rem; box-sizing: border-box; }
    form { width: min(22rem, 100%); display: grid; gap: .75rem; }
    h1 { font-size: 1.3rem; margin: 0; }
    p { margin: 0; color: #9ea2b8; }
    input { font: inherit; font-size: 1.6rem; letter-spacing: .3em; text-align: center; min-height: 3.25rem;
            background: #1e212e; color: #eceef4; border: 1px solid #363a4d; border-radius: 6px; }
    button { font: inherit; font-weight: 600; min-height: 3rem; border: 0; border-radius: 6px; background: #ffd400; color: #14151c; }
    .problem { color: #ff5c72; }
  </style>
</head>
<body>
  <form method="post" action="{{ url_for('phone.sign_in') }}">
    <h1>Shorts Pipeline</h1>
    <p>Enter the access code shown on the PC, under Phone. This phone stays signed in.</p>
    {% if problem %}<p class="problem">{{ problem }}</p>{% endif %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <input type="tel" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" required autofocus aria-label="Access code">
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
