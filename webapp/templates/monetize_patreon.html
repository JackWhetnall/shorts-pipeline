{% extends "_wizard_shell.html" %}
{% block step_content %}
<h1>Step 2: Set up Patreon</h1>
<p class="subtitle">
  Create a Patreon page for the channel &mdash; even a bare-bones one
  works to start. Once it's live, paste the page URL below.
</p>
<p>
  <a class="btn btn-ghost" href="https://www.patreon.com/portal/registration/register-become-creator" target="_blank" rel="noopener">
    Create a Patreon page &rarr;
  </a>
</p>
{% endblock %}
{% block step_fields %}
<label>Patreon URL
  <input type="text" name="patreon_url" placeholder="https://patreon.com/yourpage"
         value="{{ channel.monetization.patreon_url or '' }}">
</label>
{% endblock %}
