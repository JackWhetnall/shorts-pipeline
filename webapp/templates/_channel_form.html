{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" class="channel-form">
  {% if is_new %}
  <label>Channel key (used in URLs and its output folder, e.g. "science_facts")
    <input type="text" name="key" required pattern="[a-z0-9_]+" value="{{ channel.key or '' }}">
  </label>
  {% else %}
  <p><strong>Channel key:</strong> {{ channel.key }}</p>
  {% endif %}

  <label>Display name
    <input type="text" name="channel_display_name" required value="{{ channel.channel_display_name or '' }}">
  </label>

  <label>Outro subtext
    <input type="text" name="outro_subtext" value="{{ channel.outro_subtext or 'Subscribe for more' }}">
  </label>

  <label>Output directory
    <input type="text" name="output_dir" required
           value="{{ channel.output_dir or ('output/' ~ (channel.key or '')) }}">
  </label>

  <label>ElevenLabs voice ID
    <input type="text" name="voice" required value="{{ channel.voice or '' }}">
  </label>

  <label>Speed (1.0 = normal, lower = slower, higher = faster &mdash;
    try combos on the <a href="{{ url_for('voice_lab_page') }}">Voice Lab</a> first)
    <input type="number" name="speed" step="0.05" min="0.7" max="1.2"
           value="{{ channel.speed if channel.speed is not none else 1.0 }}">
  </label>

  <label>Content mode
    <select name="content_mode" id="content-mode-select" onchange="toggleContentModeFields()">
      <option value="static_corpus" {% if channel.content_mode == 'static_corpus' %}selected{% endif %}>
        Fixed source (a quote is fetched and read aloud)
      </option>
      <option value="topic" {% if channel.content_mode == 'topic' or not channel.content_mode %}selected{% endif %}>
        Topic (every segment is generated fresh)
      </option>
    </select>
  </label>

  <div id="static_corpus-fields" class="mode-fields">
    <label>Source
      <select name="source">
        {% for src in sources %}
        <option value="{{ src }}" {% if channel.source == src %}selected{% endif %}>{{ src }}</option>
        {% endfor %}
      </select>
    </label>
  </div>

  <div id="topic-fields" class="mode-fields">
    <label>Topics (one per line — rotated randomly each video)
      <textarea name="topics" rows="5">{{ (channel.topics or [])|join('\n') }}</textarea>
    </label>
  </div>

  <label>Style prompt (the actual content-generation instructions Claude follows)
    <textarea name="style_prompt" rows="4" required>{{ channel.style_prompt or '' }}</textarea>
  </label>

  <label>Avoid imagery (one word/phrase per line — footage matching this
    channel will never show a clip whose description contains any of these)
    <textarea name="avoid_imagery" rows="3">{{ (channel.avoid_imagery or [])|join('\n') }}</textarea>
  </label>

  <fieldset>
    <legend>Pacing</legend>
    {% for field, value in channel.pacing.items() %}
    <label>{{ field }}
      <input type="number" step="any" name="pacing_{{ field }}" value="{{ value }}">
    </label>
    {% endfor %}
  </fieldset>

  <fieldset>
    <legend>Caption / outro style</legend>
    <label>Font size <input type="number" name="style_font_size" value="{{ channel.style.font_size }}"></label>
    <label>Base color <input type="text" name="style_base_color" value="{{ channel.style.base_color }}"></label>
    <label>Highlight color <input type="text" name="style_highlight_color" value="{{ channel.style.highlight_color }}"></label>
    <label>Stroke color <input type="text" name="style_stroke_color" value="{{ channel.style.stroke_color }}"></label>
    <label>Stroke width <input type="number" name="style_stroke_width" value="{{ channel.style.stroke_width }}"></label>
    <label>Outro title color <input type="text" name="style_outro_title_color" value="{{ channel.style.outro_title_color }}"></label>
    <label>Outro subtext color <input type="text" name="style_outro_subtext_color" value="{{ channel.style.outro_subtext_color }}"></label>
    <label>Outro background color (R,G,B,A)
      <input type="text" name="style_outro_bg_color" value="{{ channel.style.outro_bg_color|join(',') }}">
    </label>
  </fieldset>

  <button type="submit">Save</button>
</form>
